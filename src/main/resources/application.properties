quarkus.application.name=payment-worker
quarkus.http.port=${HTTP_PORT:8082}

quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USERNAME:payment_worker}
quarkus.datasource.password=${DB_PASSWORD:payment_worker_dev}
quarkus.datasource.jdbc.url=${DB_JDBC_URL:jdbc:postgresql://localhost:5432/orderflow_payments}
quarkus.datasource.health.enabled=true

quarkus.flyway.migrate-at-start=true

kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.username=sa
%test.quarkus.datasource.password=
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:payments;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
%test.quarkus.kafka.devservices.enabled=false
%test.quarkus.http.test-port=0
